[package]
name = "rex-fastcopy"
version = "0.1.0"
edition = "2024"
description = "Easymotion-style text copying for Rex"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
regex = "1.11"
shell-words = "1.1"
unicode-width = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
